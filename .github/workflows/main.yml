name: Fabriquer Kepo OS ARM64

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:bookworm
      options: --privileged
    steps:
      - name: Construction de Kepo OS (Version ARM64)
        run: |
          apt-get update -y
          apt-get install -y live-build debootstrap squashfs-tools xorriso grub-efi-arm64-bin mtools dosfstools
          mkdir build && cd build
          lb config \
            --distribution bookworm \
            --archive-areas "main contrib non-free non-free-firmware" \
            --architectures arm64 \
            --linux-flavours arm64 \
            --bootloaders grub-efi \
            --bootappend-live "boot=live components quiet splash hostname=kepo-os username=kepo" \
            --iso-application "Kepo OS ARM64" \
            --iso-volume "KEPO_OS"
          mkdir -p config/package-lists
          echo "xorg xfce4 xfce4-terminal plank lightdm thunar network-manager-gnome firefox-esr calamares calamares-settings-debian arc-theme papirus-icon-theme sudo" > config/package-lists/kepo.list.chroot
          lb build
          mv live-image-arm64.hybrid.iso ../KepoOS-ARM64.iso || mv *.iso ../KepoOS-ARM64.iso

      - name: Générer le lien de téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: KepoOS-ARM64-ISO
          path: KepoOS-ARM64.iso
