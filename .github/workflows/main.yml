name: Fabriquer Kepo OS

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Construction de Kepo OS (ISO Bootable & Installable)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux
          mkdir build && cd build
          
          lb config \
            --distribution bookworm \
            --archive-areas "main contrib non-free non-free-firmware" \
            --architectures amd64 \
            --linux-flavours amd64 \
            --bootappend-live "boot=live components quiet splash hostname=kepo-os username=kepo" \
            --iso-application "Kepo OS" \
            --iso-volume "KEPO_OS"

          mkdir -p config/package-lists
          echo "xorg xfce4 xfce4-terminal plank lightdm thunar network-manager-gnome firefox-esr calamares calamares-settings-debian arc-theme papirus-icon-theme sudo neofetch" > config/package-lists/kepo.list.chroot

          mkdir -p config/includes.chroot/etc/skel/.config/autostart
          mkdir -p config/includes.chroot/usr/share/backgrounds

          cat << 'EOF' > config/includes.chroot/usr/share/backgrounds/kepo-wallpaper.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
            <defs>
              <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#090414"/><stop offset="50%" stop-color="#2e1065"/><stop offset="100%" stop-color="#0f0524"/>
              </linearGradient>
            </defs>
            <rect width="1920" height="1080" fill="url(#bg)"/>
            <circle cx="350" cy="250" r="450" fill="#ec4899" opacity="0.35"/>
            <circle cx="1500" cy="800" r="550" fill="#7e22ce" opacity="0.45"/>
            <text x="60" y="130" font-family="sans-serif" font-size="80" font-weight="900" fill="#a855f7">K</text>
          </svg>
          EOF

          cat << 'EOF' > config/includes.chroot/etc/skel/.config/autostart/plank.desktop
          [Desktop Entry]
          Type=Application
          Name=Kepo Dock
          Exec=plank
          X-GNOME-Autostart-enabled=true
          EOF

          mkdir -p config/hooks/normal
          cat << 'EOF' > config/hooks/normal/9999-kepo.hook.chroot
          #!/bin/sh
          sed -i 's/PRETTY_NAME=.*/PRETTY_NAME="Kepo OS 1.0"/' /etc/os-release
          sed -i 's/NAME=.*/NAME="Kepo OS"/' /etc/os-release
          EOF
          chmod +x config/hooks/normal/9999-kepo.hook.chroot

          sudo lb build
          mv live-image-amd64.hybrid.iso ../KepoOS.iso

      - name: Générer le lien de téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: KepoOS-ISO-Bootable
          path: KepoOS.iso
