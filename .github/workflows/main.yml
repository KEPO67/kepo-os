name: Fabriquer Kepo OS

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      options: --privileged
    steps:
      - name: Construction de Kepo OS (ISO Bootable)
        run: |
          apt-get update -y
          apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin mtools dosfstools
          mkdir build && cd build
          lb config --distribution bookworm --archive-areas "main contrib non-free non-free-firmware" --architectures amd64 --linux-flavours amd64 --bootappend-live "boot=live components quiet splash hostname=kepo-os username=kepo" --iso-application "Kepo OS" --iso-volume "KEPO_OS"
          mkdir -p config/package-lists
          echo "xorg xfce4 xfce4-terminal plank lightdm thunar network-manager-gnome firefox-esr calamares calamares-settings-debian arc-theme papirus-icon-theme sudo" > config/package-lists/kepo.list.chroot
          lb build
          mv live-image-amd64.hybrid.iso ../KepoOS.iso

      - name: Générer le lien de téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: KepoOS-ISO-Bootable
          path: KepoOS.iso
